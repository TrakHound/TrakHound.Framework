<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Api Debugger</title>
    <link rel="icon" type="image/svg+xml" href="/_debug/logo.svg" />
    <link rel="stylesheet" href="/_debug/debugger.css" />
</head>
<body>
    <!-- Laid out like the Instance's Admin header (InstanceHeader.razor): the logo, the title, then the details, divided by lines -->
    <header class="topbar">
        <div class="topbar-section topbar-toggle">
            <button id="sidebar-toggle" class="icon-button" type="button" title="Hide the endpoints" aria-label="Show or hide the endpoints">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 3.5h12M2 8h12M2 12.5h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none" /></svg>
            </button>
        </div>
        <div class="topbar-section topbar-logo">
            <img src="/_debug/logo-white.svg" alt="" />
        </div>
        <div class="topbar-section topbar-title">
            <span>TrakHound<span class="topbar-subtitle">Api Debugger</span></span>
        </div>
        <div class="topbar-section topbar-details">
            <div><b id="api-title"></b></div>
            <div id="api-version"></div>
        </div>
        <div class="spacer"></div>
        <div class="topbar-section topbar-links">
            <a href="/_debug/openapi.json" target="_blank" rel="noopener">openapi.json</a>
        </div>
    </header>

    <div class="layout">
        <nav class="sidebar">
            <input id="search" class="search" type="search" placeholder="Filter endpoints" autocomplete="off" />
            <div id="nav" class="nav"></div>
        </nav>
        <main id="main" class="main">
            <div class="empty">Loading the OpenAPI document..</div>
        </main>
    </div>

    <section id="logs" class="logs">
        <div id="logs-resize" class="logs-resize" title="Drag to resize the log"></div>
        <div class="logs-header">
            <button id="logs-toggle" class="logs-title" type="button" title="Hide the log" aria-label="Show or hide the log"><span class="chevron" aria-hidden="true"></span>Log <span id="logs-count" class="count"></span></button>
            <div class="spacer"></div>
            <select id="logs-level" title="The least severe Log Level shown">
                <option value="5">Trace</option>
                <option value="4">Debug</option>
                <option value="3" selected>Information</option>
                <option value="2">Warning</option>
                <option value="1">Error</option>
            </select>
            <input id="logs-filter" type="search" placeholder="Filter" autocomplete="off" />
            <button id="logs-clear" type="button">Clear</button>
        </div>
        <div id="logs-list" class="logs-list"></div>
    </section>

    <script src="/_debug/debugger.js"></script>
</body>
</html>
