# Mosquitto 2 only accepts clients from its own machine without a listener, so this one accepts any client without a password.
# The Broker's port is only published on 127.0.0.1 (mosquitto.yml). For a Broker other machines can reach, set
# 'allow_anonymous false' and add a 'password_file' (see https://mosquitto.org/man/mosquitto-conf-5.html)
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
