# The TimescaleDB Time Series Service (TrakHound.Timescale.Service), added to the Instance's Configuration Profile by
# docker-compose.yml. It uses the same database as the PostgreSQL Table Service, and keeps its Measurements in the
# 'trakhound_timeseries' Schema (created, with the timescaledb extension, on its first request)
id: timescale
name: TimescaleDB
description: The TimescaleDB database from the Docker Compose example
volumeId:
packageId: TrakHound.Timescale.Service
packageVersion: '*'
parameters:
  server: ${env:POSTGRES_SERVER}
  port: ${env:POSTGRES_SERVER_PORT}
  database: ${env:POSTGRES_DATABASE}
  user: ${env:POSTGRES_USER}
  password: ${env:POSTGRES_PASSWORD}
