name: Bug report
description: Something in the Framework doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For a security problem, don't use this form: report it privately (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The steps, configuration or code that shows the problem. A small example package helps.
      placeholder: |
        1. Install ...
        2. Configure ...
        3. Open ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TrakHound version
      description: Shown in the Admin interface's header, or in the header the CLI prints when it starts.
      placeholder: ex. 0.15.3
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Instance (Admin interface)
        - Instance (System API or MCP Server)
        - Package (Api, App, Function, Worker, Service or Identity)
        - CLI
        - Libraries or templates
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, and how the Instance runs (Windows Service, IIS, systemd, Docker, from source).
      placeholder: ex. Windows Server 2022, Windows Service
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines or error messages. Remove any secrets, tokens or connection strings first.
      render: text
